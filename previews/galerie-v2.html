   <div class="relative mt-12"><div id="carr" class="noscroll flex gap-5 overflow-x-auto px-[max(1.5rem,calc((100vw-72rem)/2))] pb-4" style="scroll-snap-type:x mandatory">${GAL.map(im=>`<figure class="group relative w-[72vw] shrink-0 overflow-hidden rounded-[1.5rem] shadow-xl sm:w-[20rem]" style="aspect-ratio:3/4;scroll-snap-align:center"><img src="${im.s}" loading="lazy" class="h-full w-full object-cover transition-transform duration-700 group-hover:scale-105"/><div class="absolute inset-0 bg-gradient-to-t from-walnut/60 to-transparent opacity-0 transition-opacity group-hover:opacity-100"></div><figcaption class="absolute bottom-4 left-4 font-script text-2xl text-cream opacity-0 transition-opacity group-hover:opacity-100">${im.c}</figcaption></figure>`).join('')}</div>
   <div class="mt-6 flex justify-center gap-3"><button onclick="carNav(-1)" class="grid h-12 w-12 place-items-center rounded-full bg-walnut text-cream hover:bg-terracotta text-2xl">‹</button><button onclick="carNav(1)" class="grid h-12 w-12 place-items-center rounded-full bg-walnut text-cream hover:bg-terracotta text-2xl">›</button></div></div></section>`,
 "H":()=>`<section class="bg-cream px-6 py-[clamp(4.5rem,10vw,8rem)]"><div class="mx-auto max-w-6xl">${HEADER()}
   <div class="mt-12 grid auto-rows-[10rem] grid-cols-3 gap-3 sm:grid-cols-4 sm:gap-4">${GAL.map((im,i)=>`<figure onclick="openLB(${i})" class="group relative cursor-pointer overflow-hidden rounded-2xl shadow-md ${spans[i%8]}"><img src="${im.s}" loading="lazy" class="h-full w-full object-cover transition-transform duration-700 group-hover:scale-110"/><div class="absolute inset-0 flex items-end bg-gradient-to-t from-walnut/65 via-transparent to-transparent p-4 opacity-0 transition-opacity group-hover:opacity-100"><span class="font-script text-xl text-cream">${im.a}</span></div></figure>`).join('')}</div></div></section>`,
};

function featSet(i){document.getElementById('featimg').src=GAL[i].s;document.getElementById('featcat').textContent=GAL[i].c;document.getElementById('featalt').textContent=GAL[i].a;document.querySelectorAll('.feat-th').forEach(t=>{const on=+t.dataset.fi===i;t.className='feat-th relative overflow-hidden rounded-xl transition-all duration-300 '+(on?'ring-2 ring-terracotta ring-offset-2 ring-offset-cream':'opacity-70 hover:opacity-100');});}
function carNav(d){const c=document.getElementById('carr');if(c)c.scrollBy({left:d*c.clientWidth*0.8,behavior:'smooth'});}
let lbI=0;
function openLB(i){lbI=i;showLB();}
function showLB(){let el=document.getElementById('lb');if(!el){el=document.createElement('div');el.id='lb';el.className='fixed inset-0 z-[80] grid place-items-center bg-black/90 p-4 backdrop-blur-md';el.onclick=()=>el.remove();document.body.appendChild(el);}
  el.innerHTML=`<button onclick="document.getElementById('lb').remove()" class="absolute right-5 top-5 grid h-11 w-11 place-items-center rounded-full bg-white/10 text-white text-xl">✕</button><button onclick="event.stopPropagation();navLB(-1)" class="absolute left-3 md:left-8 grid h-12 w-12 place-items-center rounded-full bg-white/10 text-white text-2xl">‹</button><button onclick="event.stopPropagation();navLB(1)" class="absolute right-3 md:right-8 grid h-12 w-12 place-items-center rounded-full bg-white/10 text-white text-2xl">›</button><img onclick="event.stopPropagation()" src="${GAL[lbI].s}" class="max-h-[80vh] max-w-[92vw] rounded-2xl object-contain"/>`;}
function navLB(d){lbI=(lbI+d+GAL.length)%GAL.length;showLB();}

const META=[["E","Polaroid-Pinboard"],["F","Featured + Thumbs"],["G","Swipe-Carousel"],["H","Editorial-Mosaik"]];
let active="E";
const app=document.getElementById('app'),sw=document.getElementById('sw');
function render(){app.innerHTML=V[active]();window.scrollTo({top:0});const lb=document.getElementById('lb');if(lb)lb.remove();}
META.forEach(([id,name])=>{const b=document.createElement('button');b.className='rounded-xl px-3.5 py-2 text-white/55 hover:text-white transition-colors';
  b.innerHTML=`<span class="block text-[0.72rem] font-semibold">Option ${id}</span><span class="hidden text-[0.6rem] opacity-70 sm:block">${name}</span>`;
  b.onclick=()=>{active=id;[...sw.children].forEach(c=>c.classList.remove('bg-white/12','ring-1','ring-white/20','text-white'));b.classList.add('bg-white/12','ring-1','ring-white/20','text-white');render();};
  sw.appendChild(b);});
sw.children[0].click();
</script>
</body>

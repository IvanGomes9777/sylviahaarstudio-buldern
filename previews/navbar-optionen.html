<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sylvias Haarstudio – Navbar: 5 Design-Optionen</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&family=Dancing+Script:wght@500;600;700&display=swap" rel="stylesheet" />
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          serif: ['"Playfair Display"', 'Georgia', 'serif'],
          cormorant: ['"Cormorant Garamond"', 'Georgia', 'serif'],
          sans: ['Inter', 'system-ui', 'sans-serif'],
          poppins: ['Poppins', 'system-ui', 'sans-serif'],
          script: ['"Dancing Script"', 'cursive'],
        },
        colors: {
          ink: '#0F0F0F', charcoal: '#1A1A1A', gold: '#D4AF37', rosegold: '#B76E79',
          beige: '#F5F1E8', espresso: '#3D2817', sage: '#9CAF88',
          magenta: '#E91E63', teal: '#00BCD4', grape: '#5E35B1',
          champagne: '#E6D5A8', walnut: '#8B6F47', cream: '#F9F6F2', terracotta: '#CC7755',
        },
      },
    },
  };
</script>
<style>
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; overflow-x: hidden; font-family: Inter, system-ui, sans-serif; }
  .stage { min-height: 220vh; }
  .ul-grow { position: relative; }
  .ul-grow::after { content:''; position:absolute; left:0; bottom:-6px; height:1px; width:0; background:currentColor; transition:width .35s cubic-bezier(.22,1,.36,1); }
  .ul-grow:hover::after { width:100%; }
  .ul-center::after { left:50%; transform:translateX(-50%); }
  @keyframes pulse-cta { 0%,100%{transform:scale(1)} 50%{transform:scale(1.045)} }
  .pulse-cta { animation: pulse-cta 2.4s ease-in-out infinite; }
  @keyframes fade-up { from{opacity:0; transform:translateY(24px)} to{opacity:1; transform:translateY(0)} }
  .fade-up { animation: fade-up .6s cubic-bezier(.22,1,.36,1) both; }
  @keyframes slide-down { from{opacity:0; transform:translateY(-80px)} to{opacity:1; transform:translateY(0)} }
  .slide-down { animation: slide-down .7s cubic-bezier(.22,1,.36,1) both; }
  @keyframes grow-x { from{transform:scaleX(0)} to{transform:scaleX(1)} }
  .grow-x { animation: grow-x 1.1s ease-out .3s both; transform-origin:center; }
  .gold-fill { position:relative; overflow:hidden; }
  .gold-fill > .fill { position:absolute; inset:0; background:#D4AF37; transform:scaleX(0); transform-origin:left; transition:transform .5s cubic-bezier(.22,1,.36,1); z-index:0; }
  .gold-fill:hover > .fill { transform:scaleX(1); }
  .gold-fill:hover { color:#0F0F0F !important; }
  .gold-fill > span { position:relative; z-index:1; }
  .champ-fill:hover { background:#E6D5A8; color:#0F0F0F; }
  .hidden-v { display:none; }
</style>
</head>
<body class="bg-black">

<!-- ============ STAGES ============ -->
<div id="stages"></div>

<!-- ============ CONTROL PANEL ============ -->
<div class="fixed inset-x-0 bottom-0 z-[60] px-3 pb-3">
  <div class="mx-auto max-w-5xl rounded-2xl border border-white/10 bg-black/85 p-2.5 shadow-2xl backdrop-blur-xl">
    <div class="mb-1 text-center text-[0.6rem] tracking-[0.3em] text-white/40">SYLVIAS HAARSTUDIO · NAVBAR-OPTIONEN — KLICKEN ZUM VERGLEICHEN</div>
    <div id="switcher" class="flex flex-wrap items-center justify-center gap-2"></div>
  </div>
</div>

<script>
const BRAND = {
  name: 'Sylvias', suffix: 'Haarstudio', line: 'HAARSTUDIO · DÜLMEN',
  slogan: 'Ihr Friseursalon für jeden Anlass',
  nav: ['Start','Über uns','Leistungen','Team','Kontakt'], cta: 'Termin buchen',
};

const VARIANTS = [
  { id:1, name:'Dark-Luxury Cinematic', tag:'Glassmorphism · Gold · Serif',
    stage:'background:radial-gradient(120% 120% at 50% 0%,#1a1a1a 0%,#0f0f0f 60%,#000 100%)', text:'text-white', badge:'border-gold/40 text-gold' },
  { id:2, name:'Minimalist Clean', tag:'Whitespace · Beige · Hairline',
    stage:'background:linear-gradient(180deg,#F5F1E8 0%,#ECE6D8 100%)', text:'text-espresso', badge:'border-espresso/30 text-espresso' },
  { id:3, name:'Playful Vibrant', tag:'Floating Pill · Gradient · Bounce',
    stage:'background:radial-gradient(110% 90% at 85% -10%,#fde4ef 0%,#FAFAFA 45%),radial-gradient(90% 80% at 0% 10%,#d6f7fb 0%,transparent 55%)', text:'text-grape', badge:'border-magenta/40 text-magenta' },
  { id:4, name:'Luxury-Gold Glamorous', tag:'Monogramm · Champagne · Symmetrie',
    stage:'background:radial-gradient(120% 120% at 50% -10%,#1d1a14 0%,#0d0d0d 70%,#000 100%)', text:'text-champagne', badge:'border-champagne/40 text-champagne' },
  { id:5, name:'Warm-Welcoming Cozy', tag:'Script-Logo · Walnut · Soft',
    stage:'background:linear-gradient(180deg,#F9F6F2 0%,#F0E7DC 100%)', text:'text-walnut', badge:'border-terracotta/40 text-terracotta' },
];

const navLinks = (cls) => BRAND.nav.map(n=>`<a href="#" class="${cls}">${n}</a>`).join('');

function navbar(id){
  if(id===1) return `
    <header data-nav class="fixed inset-x-0 top-0 z-50 slide-down">
      <div data-scroll class="border-b border-transparent transition-all duration-500">
        <nav class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4 md:px-10">
          <a href="#" class="group flex items-center gap-2.5 text-white">
            <span class="grid h-9 w-9 place-items-center rounded-full border border-gold/40 text-gold transition-transform duration-500 group-hover:rotate-[120deg]">✂</span>
            <span class="leading-none">
              <span class="block font-serif text-xl tracking-[0.12em]">SYLVIAS</span>
              <span class="block text-[0.55rem] tracking-[0.42em] text-gold/80">${BRAND.line}</span>
            </span>
          </a>
          <ul class="hidden items-center gap-9 lg:flex">${BRAND.nav.map(n=>`<li><a href="#" class="ul-grow text-sm tracking-[0.18em] text-white/80 hover:text-white">${n.toUpperCase()}</a></li>`).join('')}</ul>
          <a href="#" class="gold-fill hidden rounded-full border border-gold px-7 py-2.5 text-sm tracking-[0.16em] text-gold transition-colors duration-500 lg:inline-flex"><span class="fill"></span><span>${BRAND.cta.toUpperCase()}</span></a>
          <button data-burger class="grid h-11 w-11 place-items-center rounded-full border border-white/15 text-white lg:hidden">☰</button>
        </nav>
      </div>
    </header>`;
  if(id===2) return `
    <header data-nav class="fixed inset-x-0 top-0 z-50 bg-beige/85 backdrop-blur-md" style="animation:fade-up .8s both">
      <div data-scroll class="border-b border-transparent transition-all duration-500">
        <nav class="mx-auto flex max-w-6xl items-center justify-between px-6 py-5 md:px-10">
          <a href="#" class="leading-tight text-espresso">
            <span class="block font-cormorant text-2xl font-medium tracking-[0.18em]">SYLVIAS</span>
            <span class="mt-0.5 block text-[0.5rem] tracking-[0.5em] text-espresso/55">${BRAND.line}</span>
          </a>
          <ul class="hidden items-center gap-10 md:flex">${BRAND.nav.map(n=>`<li><a href="#" class="ul-grow ul-center text-[0.8rem] font-light tracking-[0.14em] text-espresso/75 hover:text-espresso">${n}</a></li>`).join('')}</ul>
          <a href="#" class="hidden border border-espresso/30 px-7 py-2.5 text-[0.75rem] tracking-[0.18em] text-espresso transition-all duration-500 hover:border-espresso hover:bg-espresso hover:text-beige md:inline-block">${BRAND.cta.toUpperCase()}</a>
          <button data-burger class="grid h-11 w-11 place-items-center text-espresso md:hidden">☰</button>
        </nav>
      </div>
    </header>`;
  if(id===3) return `
    <header data-nav class="fixed inset-x-0 top-4 z-50 px-4" style="animation:slide-down .6s both">
      <nav class="mx-auto flex max-w-6xl items-center justify-between rounded-[1.75rem] border border-black/5 bg-white/90 px-6 py-3 shadow-[0_18px_50px_-20px_rgba(233,30,99,0.5)] backdrop-blur-xl">
        <a href="#" class="flex items-center gap-2">
          <span class="grid h-9 w-9 place-items-center rounded-2xl bg-gradient-to-br from-magenta to-teal text-white transition-transform hover:rotate-12 hover:scale-110">✦</span>
          <span class="font-poppins text-xl font-extrabold"><span class="bg-gradient-to-r from-magenta via-grape to-teal bg-clip-text text-transparent">Sylvias</span></span>
        </a>
        <ul class="hidden items-center gap-1 md:flex">${BRAND.nav.map(n=>`<li><a href="#" class="rounded-full px-4 py-2 font-poppins text-sm font-semibold text-grape/80 transition hover:-translate-y-0.5 hover:bg-magenta/10 hover:text-magenta">${n}</a></li>`).join('')}</ul>
        <a href="#" class="pulse-cta hidden rounded-full bg-gradient-to-r from-magenta to-grape px-6 py-3 font-poppins text-sm font-bold text-white shadow-lg shadow-magenta/30 md:inline-block">${BRAND.cta} ✨</a>
        <button data-burger class="grid h-11 w-11 place-items-center rounded-2xl bg-magenta/10 text-magenta md:hidden">☰</button>
      </nav>
    </header>`;
  if(id===4) return `
    <header data-nav class="fixed inset-x-0 top-0 z-50" style="animation:slide-down .8s both">
      <div data-scroll class="backdrop-blur-md transition-all duration-500" style="background:rgba(13,13,13,0.4);padding-top:1.1rem;padding-bottom:1.1rem">
        <nav class="mx-auto grid max-w-7xl grid-cols-[1fr_auto_1fr] items-center gap-4 px-6 md:px-10">
          <ul class="hidden items-center gap-8 lg:flex">${['Start','Über uns'].map(n=>`<li><a href="#" class="ul-grow text-[0.72rem] tracking-[0.26em] text-champagne/75 hover:text-champagne">${n.toUpperCase()}</a></li>`).join('')}</ul>
          <button data-burger class="justify-self-start text-champagne lg:hidden">☰</button>
          <a href="#" class="flex flex-col items-center px-2 text-center">
            <span class="font-cormorant text-2xl font-semibold tracking-[0.3em] text-champagne">SYLVIAS</span>
            <span class="mt-1 flex items-center gap-2 text-[0.5rem] tracking-[0.4em] text-champagne/60"><span class="h-px w-5 bg-champagne/40"></span>${BRAND.line}<span class="h-px w-5 bg-champagne/40"></span></span>
          </a>
          <ul class="hidden items-center justify-end gap-8 lg:flex">${['Leistungen','Team','Kontakt'].map(n=>`<li><a href="#" class="ul-grow text-[0.72rem] tracking-[0.26em] text-champagne/75 hover:text-champagne">${n.toUpperCase()}</a></li>`).join('')}<li><a href="#" class="champ-fill border border-champagne/50 px-5 py-2 text-[0.68rem] tracking-[0.22em] text-champagne transition-colors duration-500">${BRAND.cta.toUpperCase()}</a></li></ul>
          <span class="lg:hidden"></span>
        </nav>
      </div>
      <div class="grow-x h-px bg-gradient-to-r from-transparent via-champagne/50 to-transparent"></div>
    </header>`;
  return `
    <header data-nav class="fixed inset-x-0 top-0 z-50" style="animation:slide-down .7s both">
      <div data-scroll class="backdrop-blur-md transition-all duration-500" style="background:rgba(249,246,242,0.7)">
        <nav class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4 md:px-10">
          <a href="#" class="group flex items-center gap-2">
            <span class="grid h-9 w-9 place-items-center rounded-full bg-terracotta/15 text-terracotta transition-transform group-hover:rotate-12">♥</span>
            <span class="leading-tight">
              <span class="block font-script text-3xl text-walnut">Sylvias</span>
              <span class="-mt-1 block text-[0.55rem] tracking-[0.32em] text-walnut/60">${BRAND.line}</span>
            </span>
          </a>
          <ul class="hidden items-center gap-8 md:flex">${BRAND.nav.map(n=>`<li><a href="#" class="text-[0.92rem] font-medium text-walnut/80 transition-colors duration-300 hover:text-terracotta">${n}</a></li>`).join('')}</ul>
          <a href="#" class="hidden rounded-full bg-walnut px-6 py-3 text-sm font-semibold text-cream shadow-md transition-all hover:scale-105 hover:bg-terracotta md:inline-block">${BRAND.cta}</a>
          <button data-burger class="grid h-11 w-11 place-items-center rounded-full bg-terracotta/10 text-walnut md:hidden">☰</button>
        </nav>
      </div>
    </header>`;
}

// Minimalist nav links need sage underline – build cleanly:
function navbar2fix(html){ return html; }

function buildStage(v){
  const linksMin = BRAND.nav.map(n=>`<li><a href="#" class="ul-grow ul-center text-[0.8rem] font-light tracking-[0.14em] text-espresso/75 hover:text-espresso" style="--tw:0">${n}</a></li>`).join('');
  let nav = navbar(v.id);
  if(v.id===2){
    nav = nav.replace(/<ul class="hidden items-center gap-10 md:flex">[\s\S]*?<\/ul>/, `<ul class="hidden items-center gap-10 md:flex">${linksMin}</ul>`);
  }
  return `
  <section class="stage relative" style="${v.stage}">
    <div class="sticky top-0 flex min-h-[100vh] flex-col items-center justify-center px-6 text-center">
      <div class="fade-up max-w-2xl">
        <span class="mb-6 inline-block rounded-full border px-4 py-1.5 text-[0.7rem] tracking-[0.25em] ${v.badge}">OPTION ${v.id} / 5</span>
        <h1 class="text-[clamp(2rem,1rem+6vw,4.5rem)] font-light leading-[1.05] ${v.text}">${v.name}</h1>
        <p class="mt-4 ${v.text} opacity-80 ${v.id===5?'font-script text-2xl':''}">${BRAND.slogan}</p>
        <p class="mt-3 text-xs tracking-[0.2em] opacity-60 ${v.text}">${v.tag.toUpperCase()}</p>
        <p class="mt-10 text-sm opacity-60 ${v.text}">↓ Scrolle, um das Scroll-Verhalten der Navbar live zu sehen</p>
      </div>
    </div>
    <div class="flex min-h-[100vh] items-center justify-center px-6">
      <p class="max-w-md text-center text-2xl font-light opacity-50 ${v.text}">Oben verdichtet sich die Navbar — Glassmorphism, Hairline, Schatten oder Gold-Divider setzen ein. Genau wie bei einem echten Hero.</p>
    </div>
  </section>`;
}

let active = 1;
const stagesEl = document.getElementById('stages');
const switcherEl = document.getElementById('switcher');

function render(){
  const v = VARIANTS.find(x=>x.id===active);
  stagesEl.innerHTML = navbar(active) + buildStage(v);
  if(active===2){
    // inject minimalist links with sage underline
    const ul = stagesEl.querySelector('header ul');
    if(ul) ul.innerHTML = BRAND.nav.map(n=>`<li><a href="#" class="ul-grow ul-center text-[0.8rem] font-light tracking-[0.14em] text-espresso/75 hover:text-espresso">${n}</a></li>`).join('');
  }
  wireScroll();
  wireBurger();
  window.scrollTo({top:0,behavior:'smooth'});
}

function wireScroll(){
  const bar = stagesEl.querySelector('[data-scroll]');
  if(!bar) return;
  const onScroll = ()=>{
    const y = window.scrollY;
    const sc = y > 40;
    if(active===1){ bar.style.background = sc?'rgba(15,15,15,0.72)':'rgba(15,15,15,0)'; bar.style.borderColor = sc?'rgba(212,175,55,0.25)':'transparent'; }
    if(active===2){ bar.style.borderColor = sc?'rgba(61,40,23,0.14)':'transparent'; }
    if(active===4){ bar.style.background = sc?'rgba(13,13,13,0.92)':'rgba(13,13,13,0.4)'; bar.style.paddingTop=sc?'0.65rem':'1.1rem'; bar.style.paddingBottom=sc?'0.65rem':'1.1rem'; }
    if(active===5){ bar.style.background = sc?'rgba(249,246,242,0.92)':'rgba(249,246,242,0.7)'; bar.style.boxShadow = sc?'0 10px 30px -18px rgba(139,111,71,0.55)':'none'; }
  };
  window.onscroll = onScroll; onScroll();
}

function wireBurger(){
  const b = stagesEl.querySelector('[data-burger]');
  if(!b) return;
  b.onclick = ()=>{
    const overlay = document.createElement('div');
    overlay.className='fixed inset-0 z-[70] flex flex-col bg-black/95 backdrop-blur-xl p-6';
    overlay.innerHTML = `<button class="self-end text-white text-2xl mb-8">✕</button>`+
      BRAND.nav.map(n=>`<a href="#" class="border-b border-white/10 py-4 text-2xl font-serif text-white/90">${n}</a>`).join('')+
      `<a href="#" class="mt-8 rounded-full bg-white py-4 text-center font-semibold text-black">${BRAND.cta}</a>`;
    overlay.querySelector('button').onclick=()=>overlay.remove();
    document.body.appendChild(overlay);
  };
}

VARIANTS.forEach(v=>{
  const btn = document.createElement('button');
  btn.className='rounded-xl px-3.5 py-2 text-center text-white/55 transition-colors hover:text-white';
  btn.innerHTML = `<span class="block text-[0.7rem] font-semibold">Option ${v.id}</span><span class="hidden text-[0.6rem] opacity-70 sm:block">${v.name.split(' ')[0]}</span>`;
  btn.onclick = ()=>{ active=v.id; [...switcherEl.children].forEach(c=>{c.classList.remove('bg-white/12','ring-1','ring-white/20','text-white');c.classList.add('text-white/55');}); btn.classList.add('bg-white/12','ring-1','ring-white/20','text-white'); btn.classList.remove('text-white/55'); render(); };
  switcherEl.appendChild(btn);
});
switcherEl.children[0].click();
</script>
</body>
</html>
